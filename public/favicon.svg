<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="45" fill="#0b3d91"/>
  <!-- Stars -->
  <circle cx="25" cy="30" r="1.5" fill="white"/>
  <circle cx="70" cy="20" r="1" fill="white"/>
  <circle cx="80" cy="60" r="2" fill="white"/>
  <circle cx="30" cy="70" r="1" fill="white"/>
  <circle cx="45" cy="40" r="1.5" fill="white"/>
  <!-- The Red Chevron (Swoosh) -->
  <path d="M 20 80 Q 50 10 90 40 Q 55 25 15 75 Z" fill="#fc3d21"/>
